# docker-compose.app-only.yml
# Use this when running Supabase via CLI (npx supabase start)
# This only starts the Next.js app container

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: eduplay-app
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src:delegated
      - ./public:/app/public:delegated
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./next.config.ts:/app/next.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      - ./postcss.config.mjs:/app/postcss.config.mjs
      - ./tailwind.config.ts:/app/tailwind.config.ts
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_SUPABASE_URL=http://localhost:54421
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXT_PUBLIC_APP_NAME=EduPlay
      # Windows file watching support
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    network_mode: "host"  # Use host network to access Supabase on localhost
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  app_node_modules:
  app_next:
