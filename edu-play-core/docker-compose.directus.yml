# docker-compose.directus.yml
# Directus CMS (Phase 1 — admin authoring surface) for local development.
#
# Do not run this file directly. Use the wrapper, which bootstraps the database
# role and generates local secrets first:
#
#   npm run directus:up      (from the repo root or edu-play-core/)
#   npm run directus:status
#   npm run directus:stop
#
# Directus attaches to the Supabase CLI stack (`npm run db:start`) via its
# Docker network and talks to the `db` container directly. It connects as the
# dedicated `directus_admin` role and keeps its system tables in the `directus`
# schema (see supabase/migrations/20260528000000_directus_role_and_schema.sql).
#
# All variables come from edu-play-core/.env.directus (gitignored), generated by
# scripts/directus.mjs. There are deliberately no fallback secrets here.

name: eduplay-directus

services:
  directus:
    image: directus/directus:11.17.4
    container_name: eduplay-directus
    ports:
      - "8055:8055"
    environment:
      KEY: ${DIRECTUS_KEY:?run npm run directus:up}
      SECRET: ${DIRECTUS_SECRET:?run npm run directus:up}
      PUBLIC_URL: http://localhost:8055
      DB_CLIENT: pg
      # `db` is the network alias of the Supabase CLI Postgres container.
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: postgres
      DB_USER: directus_admin
      DB_PASSWORD: ${DIRECTUS_DB_PASSWORD:?run npm run directus:up}
      # Directus system tables are created in the first schema (`directus`).
      # `public` is included so Directus can introspect app tables.
      DB_SEARCH_PATH: directus,public
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:?run npm run directus:up}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:?run npm run directus:up}
      PUBLIC_REGISTRATION: "false"
      TELEMETRY: "false"
      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_DRIVER: local
      STORAGE_LOCAL_ROOT: /directus/uploads
      # CORS: Next.js app on :3000 may embed Data Studio links/iframes later.
      CORS_ENABLED: "true"
      CORS_ORIGIN: http://localhost:3000
    volumes:
      - directus-uploads:/directus/uploads
      - directus-extensions:/directus/extensions
    networks:
      - supabase
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8055/server/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

networks:
  supabase:
    # Created by the Supabase CLI: supabase_network_<project_id from supabase/config.toml>
    name: supabase_network_edu-play-core
    external: true

volumes:
  directus-uploads:
  directus-extensions:
