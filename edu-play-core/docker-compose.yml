# docker-compose.yml
# EduPlay Development Environment
# Run: make dev OR docker compose up -d

services:
  # ============================================
  # Next.js Application
  # ============================================
  app:
    build:
      context: ..
      dockerfile: edu-play-core/Dockerfile.dev
    container_name: eduplay-app
    ports:
      - "3000:3000"
    volumes:
      # Mount source code with delegated mode for better Windows performance
      - ./src:/repo/edu-play-core/src:delegated
      - ./public:/repo/edu-play-core/public:delegated
      - ./package.json:/repo/edu-play-core/package.json
      - ./next.config.ts:/repo/edu-play-core/next.config.ts
      - ./tsconfig.json:/repo/edu-play-core/tsconfig.json
      - ./postcss.config.mjs:/repo/edu-play-core/postcss.config.mjs
      - ./tailwind.config.ts:/repo/edu-play-core/tailwind.config.ts
      # Use named volumes for node_modules and .next to avoid conflicts
      - ./packages:/repo/edu-play-core/packages:delegated
      - workspace_node_modules:/repo/node_modules
      - app_next:/repo/edu-play-core/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_SUPABASE_URL=http://localhost:54421
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXT_PUBLIC_APP_NAME=EduPlay
      # Windows file watching support
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-kong:
        condition: service_started
    networks:
      - eduplay-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================
  # Supabase Services
  # ============================================

  # PostgreSQL Database
  supabase-db:
    image: supabase/postgres:15.1.1.61
    container_name: eduplay-db
    ports:
      - "54422:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters}
      JWT_EXP: 3600
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      # Mount SQL files for initialization (temporarily disabled to debug)
      # - ./supabase/00-init-roles.sql:/docker-entrypoint-initdb.d/00-init-roles.sql:ro
      # - ./supabase/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # - ./supabase/storage.sql:/docker-entrypoint-initdb.d/02-storage.sql:ro
      # - ./supabase/seed-games.sql:/docker-entrypoint-initdb.d/03-seed-games.sql:ro
      # - ./supabase/fix-students-rls.sql:/docker-entrypoint-initdb.d/04-fix-students-rls.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eduplay-network

  # Supabase Studio (Database GUI)
  supabase-studio:
    image: supabase/studio:20240101-8e4a094
    container_name: eduplay-studio
    ports:
      - "54423:3000"
    environment:
      STUDIO_PG_META_URL: http://supabase-meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DEFAULT_ORGANIZATION_NAME: EduPlay
      DEFAULT_PROJECT_NAME: EduPlay Local
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_PUBLIC_URL: http://localhost:54421
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-meta:
        condition: service_started
    networks:
      - eduplay-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Supabase Auth (GoTrue)
  supabase-auth:
    image: supabase/gotrue:v2.143.0
    container_name: eduplay-auth
    ports:
      - "54424:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:54421
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:***@supabase-db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: admin@eduplay.local
      GOTRUE_SMTP_HOST: supabase-inbucket
      GOTRUE_SMTP_PORT: 2500
      GOTRUE_SMTP_SENDER_NAME: EduPlay
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - eduplay-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Supabase REST API (PostgREST)
  supabase-rest:
    image: postgrest/postgrest:v12.0.1
    container_name: eduplay-rest
    ports:
      - "54325:3000"
    environment:
      PGRST_DB_URI: postgres://authenticator:***@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters}
      PGRST_APP_SETTINGS_JWT_EXP: 3600
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - eduplay-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Supabase Realtime
  supabase-realtime:
    image: supabase/realtime:v2.27.5
    container_name: eduplay-realtime
    ports:
      - "54326:4000"
    environment:
      PORT: 4000
      DB_HOST: supabase-db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1/u2oq}
      ERL_AFLAGS: -proto_dist inet_tcp
      ENABLE_TAILSCALE: "false"
      DNS_NODES: "''"
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - eduplay-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Supabase Storage
  supabase-storage:
    image: supabase/storage-api:v0.46.4
    container_name: eduplay-storage
    ports:
      - "54327:5000"
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      POSTGREST_URL: http://supabase-rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters}
      DATABASE_URL: postgres://supabase_storage_admin:***@supabase-db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://supabase-imgproxy:8080
    volumes:
      - supabase-storage-data:/var/lib/storage
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-rest:
        condition: service_started
    networks:
      - eduplay-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/status"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Supabase Meta (for Studio)
  supabase-meta:
    image: supabase/postgres-meta:v0.79.0
    container_name: eduplay-meta
    ports:
      - "54328:8080"
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - eduplay-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Kong API Gateway (Main entry point)
  supabase-kong:
    image: kong:2.8.1
    container_name: eduplay-kong
    ports:
      - "54421:8000"  # Main Supabase API URL
      - "54329:8443"  # HTTPS
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    volumes:
      - ./docker/kong/kong.yml:/var/lib/kong/kong.yml:ro
    depends_on:
      supabase-auth:
        condition: service_started
      supabase-rest:
        condition: service_started
      supabase-storage:
        condition: service_started
    networks:
      - eduplay-network
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Email testing (catches all emails locally) - PORT CHANGED FROM 54424 to 54330
  supabase-inbucket:
    image: inbucket/inbucket:3.0.3
    container_name: eduplay-inbucket
    ports:
      - "54330:9000"  # Web UI (changed from 54424 to fix port conflict)
      - "2500:2500"   # SMTP
    networks:
      - eduplay-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================
  # Directus CMS (Phase 1 — admin authoring surface)
  # ============================================
  # Self-hosted Directus pointed at the Supabase Postgres. Uses a dedicated
  # `directus_admin` role + `directus` schema (see migration
  # 20260528000000_directus_role_and_schema.sql). Operators must run, once,
  # against the local DB:
  #
  #   ALTER ROLE directus_admin WITH LOGIN PASSWORD '${DIRECTUS_DB_PASSWORD}';
  #
  # The migration creates the role NOLOGIN by default to prevent the service
  # from authenticating in unconfigured environments.
  directus:
    image: directus/directus:11
    container_name: eduplay-directus
    ports:
      - "8055:8055"
    environment:
      KEY: ${DIRECTUS_KEY:-replace-me-32-char-random-string-aaaa}
      SECRET: ${DIRECTUS_SECRET:-replace-me-32-char-random-string-bbbb}
      PUBLIC_URL: http://localhost:8055
      DB_CLIENT: pg
      DB_HOST: supabase-db
      DB_PORT: 5432
      DB_DATABASE: postgres
      DB_USER: directus_admin
      DB_PASSWORD: ${DIRECTUS_DB_PASSWORD:-directus-local-dev}
      # Directus system tables live in the `directus` schema (created by the
      # bootstrap migration). `public` is included so Directus can introspect
      # app tables. Order matters — Directus' own tables resolve first.
      DB_SEARCH_PATH: directus,public
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@eduplay.local}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-changeme}
      # Disable self-service signup; admin users are created via Data Studio.
      AUTH_DISABLE_DEFAULT: "false"
      PUBLIC_REGISTRATION: "false"
      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_DRIVER: local
      STORAGE_LOCAL_ROOT: /directus/uploads
      # CORS: Next.js app on :3000 may embed Data Studio links/iframes later.
      CORS_ENABLED: "true"
      CORS_ORIGIN: http://localhost:3000
    volumes:
      - directus-uploads:/directus/uploads
      - directus-extensions:/directus/extensions
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - eduplay-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8055/server/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Image transformation
  supabase-imgproxy:
    image: darthsim/imgproxy:v3.21
    container_name: eduplay-imgproxy
    environment:
      IMGPROXY_BIND: ":8080"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
    volumes:
      - supabase-storage-data:/var/lib/storage
    networks:
      - eduplay-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

# ============================================
# Networks & Volumes
# ============================================
networks:
  eduplay-network:
    driver: bridge

volumes:
  supabase-db-data:
  supabase-storage-data:
  workspace_node_modules:
  app_next:
  directus-uploads:
  directus-extensions:
