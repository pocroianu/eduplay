<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Badges & dots</title>
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 28px; background: #fff; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font: 700 12px/1 Lexend, sans-serif;
    padding: 4px 10px;
    border-radius: 6px;
  }
  .badge-new { background: var(--ss-yellow-500); color: var(--ss-ink-900); }
  .badge-ai  { background: var(--ss-purple-050); color: var(--ss-purple-600); }
  .badge-success { background: var(--ss-green-050); color: var(--ss-green-800); }
  .badge-warn { background: #FFF1CC; color: #7A5A00; }
  .badge-danger { background: var(--ss-pink-100); color: var(--ss-pink-900); }
  .pill-tag { display: inline-flex; align-items: center; gap: 8px;
    background: var(--ss-purple-050); color: var(--ss-purple-600);
    font: 600 13px/1 Lexend, sans-serif; padding: 6px 12px; border-radius: 999px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot-pink { background: var(--ss-pink-600); }
  .dot-green { background: var(--ss-green-700); }
  .row + .row { margin-top: 14px; }
  .count {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 18px; height: 18px; padding: 0 6px;
    background: var(--ss-pink-600); color: #fff;
    border-radius: 999px;
    font: 700 11px/1 Lexend, sans-serif;
  }
</style>
</head>
<body>
  <div class="row">
    <span class="badge badge-new">New</span>
    <span class="badge badge-ai">AI Preview</span>
    <span class="badge badge-success">Assigned</span>
    <span class="badge badge-warn">Trial</span>
    <span class="badge badge-danger">Overdue</span>
  </div>
  <div class="row">
    <span class="pill-tag">1st Grade</span>
    <span class="pill-tag">Reading</span>
    <span class="pill-tag">Science</span>
  </div>
  <div class="row" style="gap:18px;align-items:center">
    <span class="dot dot-pink"></span><span class="muted">notification dot</span>
    <span class="dot dot-green"></span><span class="muted">online indicator</span>
    <span class="count">1</span>
    <span class="count">12</span>
    <span class="count">99+</span>
  </div>
</body>
</html>
