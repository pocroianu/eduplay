<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neutrals & surfaces</title>
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 28px; }
  .swatch {
    flex: 1; min-width: 0;
    border-radius: 12px;
    padding: 14px;
    height: 110px;
    display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: var(--ss-shadow-sm);
    border: 1px solid var(--ss-line-200);
  }
  .swatch .name { font-weight: 700; font-size: 14px; }
  .swatch .role { font-size: 11px; opacity: 0.75; }
  .swatch .hex  { font-family: var(--ss-font-mono); font-size: 11px; opacity: 0.75; }
  .row + .row { margin-top: 12px; }
</style>
</head>
<body>
  <div class="row">
    <div class="swatch" style="background:#0E1B22;color:#FFF;border-color:transparent">
      <div><div class="name">Ink 900</div><div class="role">primary text</div></div>
      <div class="hex">#0E1B22</div>
    </div>
    <div class="swatch" style="background:#455661;color:#FFF;border-color:transparent">
      <div><div class="name">Ink 700</div><div class="role">secondary</div></div>
      <div class="hex">#455661</div>
    </div>
    <div class="swatch" style="background:#7B8993;color:#FFF;border-color:transparent">
      <div><div class="name">Ink 500</div><div class="role">tertiary · placeholder</div></div>
      <div class="hex">#7B8993</div>
    </div>
    <div class="swatch" style="background:#D3DBE0;color:#0E1B22">
      <div><div class="name">Line 300</div><div class="role">border</div></div>
      <div class="hex">#D3DBE0</div>
    </div>
  </div>
  <div class="row">
    <div class="swatch" style="background:#FFFFFF;color:#0E1B22">
      <div><div class="name">Surface 0</div><div class="role">card</div></div>
      <div class="hex">#FFFFFF</div>
    </div>
    <div class="swatch" style="background:#F3F7F8;color:#0E1B22">
      <div><div class="name">Surface 1</div><div class="role">app shell</div></div>
      <div class="hex">#F3F7F8</div>
    </div>
    <div class="swatch" style="background:#F5F7F8;color:#0E1B22">
      <div><div class="name">Surface 2</div><div class="role">page canvas</div></div>
      <div class="hex">#F5F7F8</div>
    </div>
    <div class="swatch" style="background:#EEF3F5;color:#0E1B22">
      <div><div class="name">Surface 3</div><div class="role">inset / cool</div></div>
      <div class="hex">#EEF3F5</div>
    </div>
  </div>
</body>
</html>
