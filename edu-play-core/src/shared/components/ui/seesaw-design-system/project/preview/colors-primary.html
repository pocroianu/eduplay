<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seesaw brand colors</title>
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 28px; }
  .swatch {
    flex: 1; min-width: 0;
    border-radius: 12px;
    padding: 16px 14px;
    height: 110px;
    display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: var(--ss-shadow-sm);
  }
  .swatch .name { font-weight: 700; font-size: 14px; }
  .swatch .hex  { font-family: var(--ss-font-mono); font-size: 11px; opacity: 0.85; }
  .row + .row { margin-top: 12px; }
</style>
</head>
<body>
  <div class="row">
    <div class="swatch" style="background:#0E7C8C;color:#fff">
      <div class="name">Primary 600</div><div class="hex">#0E7C8C</div>
    </div>
    <div class="swatch" style="background:#094856;color:#fff">
      <div class="name">Teal 800</div><div class="hex">#094856</div>
    </div>
    <div class="swatch" style="background:#062E36;color:#fff">
      <div class="name">Teal 900</div><div class="hex">#062E36</div>
    </div>
    <div class="swatch" style="background:#2E97A8;color:#fff">
      <div class="name">Teal 400</div><div class="hex">#2E97A8</div>
    </div>
    <div class="swatch" style="background:#A6D2D8;color:#0E1B22">
      <div class="name">Teal 200</div><div class="hex">#A6D2D8</div>
    </div>
    <div class="swatch" style="background:#EAF6F8;color:#0E1B22">
      <div class="name">Teal 050</div><div class="hex">#EAF6F8</div>
    </div>
  </div>
</body>
</html>
