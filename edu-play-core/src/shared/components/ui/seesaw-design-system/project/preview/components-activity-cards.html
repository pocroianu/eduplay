<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Activity thumbnail card</title>
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 24px; background: var(--ss-surface-2); }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .acard {
    background: #fff; border-radius: 12px; overflow: hidden;
    box-shadow: var(--ss-shadow-sm);
  }
  .thumb { aspect-ratio: 1.4 / 1; position: relative; }
  .thumb .tag {
    position: absolute; top: 10px; right: 10px;
    background: rgba(255,255,255,0.95); color: var(--ss-fg);
    font: 700 11px/1 Lexend; padding: 6px 10px; border-radius: 999px;
  }
  .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; }
  .body .who { display: flex; align-items: center; gap: 8px; }
  .who .av { width: 24px; height: 24px; border-radius: 50%; background: #fdcb6b; font: 700 10px/1 Lexend; color: #0E1B22; display: inline-flex; align-items: center; justify-content: center; }
  .who .nm { font: 500 12px/1 Lexend; color: var(--ss-fg-muted); }
  .ttl { font: 600 14px/1.3 Lexend; color: var(--ss-fg); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</head>
<body>
<div class="grid">
  <div class="acard">
    <div class="thumb" style="background:linear-gradient(135deg,#C2DBB6 0%,#7FB995 100%)">
      <span class="tag">Reading</span>
    </div>
    <div class="body">
      <div class="who"><span class="av">MT</span><span class="nm">Mrs. Thorpe</span></div>
      <div class="ttl">Long E Match (ee) — UFLI Lesson 37a</div>
    </div>
  </div>
  <div class="acard">
    <div class="thumb" style="background:linear-gradient(135deg,#F2B6B6 0%,#FDCB6B 100%)">
      <span class="tag">Assessment</span>
    </div>
    <div class="body">
      <div class="who"><span class="av" style="background:#0E7C8C;color:#fff">KS</span><span class="nm">Kyla Shepherd</span></div>
      <div class="ttl">Decode to Match — Long u (CVCe)</div>
    </div>
  </div>
  <div class="acard">
    <div class="thumb" style="background:linear-gradient(135deg,#FFB400 0%,#FC747C 100%)">
      <span class="tag">Math</span>
    </div>
    <div class="body">
      <div class="who"><span class="av" style="background:#2F7A2F;color:#fff">RS</span><span class="nm">R. Sanchez</span></div>
      <div class="ttl">Count by 5s to 100</div>
    </div>
  </div>
</div>
</body>
</html>
