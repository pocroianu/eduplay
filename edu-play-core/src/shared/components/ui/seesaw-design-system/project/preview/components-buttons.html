<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Buttons</title>
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 28px; background: #fff; }
  .btn {
    font: 600 14px/1 Lexend, sans-serif;
    border: 0; cursor: pointer;
    padding: 10px 18px;
    border-radius: 8px;
    display: inline-flex; align-items: center; gap: 8px;
    transition: background-color 200ms cubic-bezier(0.4,0,0.2,1), box-shadow 200ms;
  }
  .btn-primary { background: var(--ss-primary); color: #fff; }
  .btn-primary:hover { background: var(--ss-primary-hover); }
  .btn-success { background: var(--ss-green-800); color: #fff; }
  .btn-secondary { background: #fff; color: var(--ss-primary); box-shadow: inset 0 0 0 1.5px var(--ss-primary); }
  .btn-ghost { background: transparent; color: var(--ss-primary); }
  .btn-ghost:hover { background: var(--ss-purple-050); }
  .btn-danger { background: var(--ss-danger); color: #fff; }
  .btn-disabled { background: var(--ss-line-200); color: var(--ss-ink-400); cursor: not-allowed; }
  .btn-pill { border-radius: 999px; }
  .btn-sm { padding: 6px 12px; font-size: 13px; }
  .btn-lg { padding: 14px 24px; font-size: 16px; }
  .wrap { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .wrap + .wrap { margin-top: 14px; }
  .label { font-family: var(--ss-font-mono); font-size: 11px; color: var(--ss-fg-subtle); }
  svg { width: 18px; height: 18px; fill: currentColor; }
</style>
</head>
<body>
  <div class="wrap">
    <button class="btn btn-primary">Add</button>
    <button class="btn btn-primary">
      <svg viewBox="0 0 24 24"><path d="M19 11h-6V5a1 1 0 0 0-2 0v6H5a1 1 0 0 0 0 2h6v6a1 1 0 0 0 2 0v-6h6a1 1 0 0 0 0-2z"/></svg>
      New Activity
    </button>
    <button class="btn btn-success">Post to Journal</button>
    <button class="btn btn-secondary">Cancel</button>
    <button class="btn btn-ghost">View All</button>
    <button class="btn btn-danger">Delete Class</button>
  </div>
  <div class="wrap">
    <button class="btn btn-primary btn-pill">Start 60 Day Trial</button>
    <button class="btn btn-primary btn-sm">Save</button>
    <button class="btn btn-primary btn-lg">Generate Activity</button>
    <button class="btn btn-disabled" disabled>Disabled</button>
  </div>
</body>
</html>
