<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inputs</title>
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 24px; background: #fff; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font: 600 13px/1 Lexend, sans-serif; color: var(--ss-fg); }
  .input {
    font: 400 15px/1 Lexend, sans-serif;
    background: #fff;
    border: 1.5px solid var(--ss-line-300);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--ss-fg);
    transition: border-color 200ms, box-shadow 200ms;
  }
  .input::placeholder { color: var(--ss-ink-500); }
  .input:hover { border-color: var(--ss-ink-500); }
  .input:focus { outline: none; border-color: var(--ss-primary); box-shadow: 0 0 0 3px rgba(95,47,168,0.18); }
  .input.error { border-color: var(--ss-danger); }
  .input.disabled { background: var(--ss-surface-1); color: var(--ss-ink-500); }
  .search {
    display: flex; align-items: center; gap: 10px;
    background: #fff;
    border: 1.5px solid var(--ss-line-300);
    border-radius: 8px;
    padding: 10px 14px;
  }
  .search svg { width: 18px; height: 18px; fill: var(--ss-fg-subtle); }
  .search input { border: 0; outline: 0; flex: 1; font: 400 15px/1 Lexend; background: transparent; }
  .help { font-size: 12px; color: var(--ss-fg-muted); }
  .help.error { color: var(--ss-danger); }
</style>
</head>
<body>
  <div class="field">
    <label>Class name</label>
    <input class="input" value="Bradiceni">
  </div>
  <div class="field">
    <label>Search</label>
    <div class="search">
      <svg viewBox="0 0 24 24"><path d="M10 4a6 6 0 1 1-4.2 10.2L2 18l-1-1 3.8-3.8A6 6 0 0 1 10 4zm0 2a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg>
      <input placeholder="Search for reading, math, science, and more">
    </div>
  </div>
  <div class="field">
    <label>Disabled</label>
    <input class="input disabled" value="pocroianu.nicolae@gmail.com" disabled>
  </div>
  <div class="field">
    <label>Error</label>
    <input class="input error" value="Br">
    <div class="help error">Class name must be at least 3 characters.</div>
  </div>
</body>
</html>
