<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lexend weights</title>
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 28px; background: #fff; }
  .specimen { display: flex; align-items: baseline; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--ss-line-100); }
  .specimen:last-child { border-bottom: 0; }
  .label { width: 110px; flex: none; font-family: var(--ss-font-mono); font-size: 11px; color: var(--ss-fg-subtle); }
  .glyphs { font: 400 22px/1 Lexend,sans-serif; color: var(--ss-fg); }
  .name { font-family: var(--ss-font-mono); font-size: 11px; color: var(--ss-fg-muted); margin-left: auto; }
</style>
</head>
<body>
  <div class="specimen"><div class="label">300 Light</div>
    <div class="glyphs" style="font-weight:300">The quick brown fox jumps</div><div class="name">Lexend</div></div>
  <div class="specimen"><div class="label">400 Regular</div>
    <div class="glyphs" style="font-weight:400">The quick brown fox jumps</div><div class="name">Lexend</div></div>
  <div class="specimen"><div class="label">500 Medium</div>
    <div class="glyphs" style="font-weight:500">The quick brown fox jumps</div><div class="name">Lexend</div></div>
  <div class="specimen"><div class="label">600 SemiBold</div>
    <div class="glyphs" style="font-weight:600">The quick brown fox jumps</div><div class="name">Lexend</div></div>
  <div class="specimen"><div class="label">700 Bold</div>
    <div class="glyphs" style="font-weight:700">The quick brown fox jumps</div><div class="name">Lexend</div></div>
  <div class="specimen"><div class="label">800 ExtraBold</div>
    <div class="glyphs" style="font-weight:800">The quick brown fox jumps</div><div class="name">Lexend</div></div>
</body>
</html>
