		<title>edu-play Activity Host</title>
		<style>
			html,
			body,
			#game-root {
				width: 100%;
				height: 100%;
				margin: 0;
			}

				background: #151923;
				font-family: system-ui, sans-serif;
			}

				min-height: 100%;
